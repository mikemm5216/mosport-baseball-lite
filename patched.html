<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071322">
  <title>MOSPORT 棒球人生</title>
  <style>
    html,body{margin:0;min-height:100%;background:#071322;color:#f6f9ff;font-family:Inter,"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
    #boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
    #boot b{display:block;font-size:22px;margin-bottom:8px}#boot span{color:#9eafc6;font-size:13px;line-height:1.7}
    #boot.error b{color:#ff9aa5}
  </style>
</head>
<body>
  <div id="boot"><div><b>載入棒球人生…</b><span>正在接上球季事件與休賽季市場。</span></div></div>
  <script>
  (async()=>{
    const boot=document.getElementById('boot');
    const fail=(msg)=>{boot.className='error';boot.innerHTML=`<div><b>版本載入失敗</b><span>${String(msg).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</span></div>`};
    try{
      const res=await fetch('/index.html?source=market-fix-v2',{cache:'no-store'});
      if(!res.ok)throw new Error(`無法取得原始遊戲頁面 (${res.status})`);
      let html=await res.text();

      const replaceExact=(label,target,replacement)=>{
        if(!html.includes(target))throw new Error(`Patch point missing: ${label}`);
        html=html.replace(target,replacement);
      };
      const replaceRegex=(label,regex,replacement)=>{
        if(!regex.test(html))throw new Error(`Patch point missing: ${label}`);
        html=html.replace(regex,replacement);
      };

      // 0) MARKET is a real persisted phase; reload must not turn it into FLOW_RESUME.
      replaceExact('hydrate-market-phase',
        "if(!['PRESEASON','EVENT','EVENT_RESULT','GAME','GAME_RESULT','REVIEW','TRANSITION','DRAFT_RESULT','RETIRED'].includes(s.phase)){s.phase='FLOW_RESUME';s.currentDecision=null;s.lastDecision=null}",
        "if(!['PRESEASON','EVENT','EVENT_RESULT','GAME','GAME_RESULT','REVIEW','MARKET','TRANSITION','DRAFT_RESULT','RETIRED'].includes(s.phase)){s.phase='FLOW_RESUME';s.currentDecision=null;s.lastDecision=null}"
      );

      html=html.replace("'復健鬥士','國際賽國手','旅外關注'];","'復健鬥士','國際賽國手','旅外關注','完成續約','完成交易','自由市場轉隊','旅外球員','國家隊徵召'];");

      // 1) Sidebar: expose the actual professional contract.
      replaceExact('contract-row',
        '<div class="meta-row" id="entryRow" style="display:none"><span>加入方式</span><b id="entryMethod">—</b></div><div class="meta-row"><span>傷病</span>',
        '<div class="meta-row" id="entryRow" style="display:none"><span>加入方式</span><b id="entryMethod">—</b></div><div class="meta-row" id="contractRow" style="display:none"><span>合約</span><b id="contractSummary">—</b></div><div class="meta-row"><span>傷病</span>'
      );

      // 2) End of a pro season consumes one contract year before the market opens.
      replaceExact('next-season-contract-clock',
        "function nextSeason(){archiveCurrentSeason();generateMarket();state.phase='MARKET';state.currentDecision=null;log(`下一階段評估開始：${state.marketOpportunities.filter(x=>x.chance>=48).length} 個單位主動索取資料。`);save(true);render()}",
        "function nextSeason(){archiveCurrentSeason();if(state.stage==='PRO'&&state.contract){const r=state.contract.yearsRemaining??state.contract.years??1;state.contract.yearsRemaining=Math.max(0,r-1)}generateMarket();state.phase='MARKET';state.currentDecision=null;state.marketFollowups=[];state.marketFollowupsBuilt=false;state.marketFallbackShown=false;state.offseasonCommitment=null;log(`下一階段評估開始：${state.marketOpportunities.filter(x=>x.chance>=48).length} 個單位主動索取資料。`);save(true);render()}"
      );

      // 3) Replace the dead-end market reply with a real follow-up event chain.
      const helpers = String.raw`
    function moneyText(amount,currency='TWD'){
      const code=currency==='TWD'?'NT$':currency==='JPY'?'¥':currency==='KRW'?'₩':currency==='USD'?'US$':currency+' ';
      return code+Math.round(amount||0).toLocaleString('zh-TW')
    }
    function contractYearsLeft(){if(!state.contract)return 0;return Math.max(0,state.contract.yearsRemaining??state.contract.years??0)}
    function contractSummary(){
      if(!state.contract)return'尚無職業合約';
      const left=contractYearsLeft(),league=state.contract.league||'職棒',salary=moneyText(state.contract.salary||0,state.contract.currency||'TWD');
      return left>0?league+' · 剩 '+left+' 年 · '+salary+'/年':league+' · 合約到期 · '+salary+'/年'
    }
    function marketClubName(name){return String(name||'').replace(/海外球探部|國際球探部/g,'').trim()}
    function overseasLeague(name){return /讀賣|軟銀/.test(name)?'NPB':/韓華/.test(name)?'KBO':'MLB'}
    function marketChoice(label,baseChance,successTitle,successText,successEffect,failureTitle,failureText,failureEffect,marketAction){return{label,baseChance,success:{title:successTitle,text:successText,effect:successEffect||{}},failure:{title:failureTitle,text:failureText,effect:failureEffect||{}},marketAction}}
    function renewalOffer(item,aggressive=false){
      const league=state.contract?.league||'CPBL',currency=state.contract?.currency||(league==='NPB'?'JPY':league==='KBO'?'KRW':league==='MLB'?'USD':'TWD'),floor=currency==='JPY'?3500000:currency==='KRW'?36000000:currency==='USD'?45000:600000,step=currency==='JPY'?100000:currency==='KRW'?1000000:currency==='USD'?1000:10000,base=Math.max(floor,state.contract?.salary||floor),grade={S:1.28,A:1.18,B:1.08,C:.98}[state.seasonGrade]||1,market=1+Math.max(0,item.chance-50)/260,factor=grade*market*(aggressive?1.12:1),salary=Math.round(base*factor/step)*step,years=state.seasonGrade==='S'||item.chance>=82?3:item.chance>=62?2:1;
      return{league,team:state.team,level:state.proIdentity?.level||state.contract?.level||league+'一軍',salary,signingBonus:0,currency,years,yearsRemaining:years,role:state.rosterRole,signedForYear:state.year+1}
    }
    function cpblMoveOffer(item,aggressive=false){
      const base=Math.max(650000,state.contract?.salary||650000),grade={S:1.35,A:1.23,B:1.12,C:1.02}[state.seasonGrade]||1,salary=Math.round(base*grade*(aggressive?1.1:1)/10000)*10000,years=item.chance>=80?3:item.chance>=58?2:1;
      return{league:'CPBL',team:item.name,level:'CPBL一軍',salary,signingBonus:0,currency:'TWD',years,yearsRemaining:years,role:item.chance>=72?'一軍主力競爭':'一軍輪替競爭',signedForYear:state.year+1}
    }
    function overseasOffer(item,aggressive=false){
      const league=overseasLeague(item.name),team=marketClubName(item.name),high=item.chance>=78;
      if(league==='NPB'){const salary=Math.round((high?12000000:6500000)*(aggressive?1.1:1)/100000)*100000,years=high?2:1;return{league,team,level:high?'NPB一軍競爭':'NPB育成／二軍',salary,currency:'JPY',years,yearsRemaining:years,role:high?'一軍名單競爭':'育成與二軍出賽',signedForYear:state.year+1}}
      if(league==='KBO'){const salary=Math.round((high?90000000:55000000)*(aggressive?1.1:1)/1000000)*1000000,years=high?2:1;return{league,team,level:high?'KBO一軍競爭':'KBO二軍',salary,currency:'KRW',years,yearsRemaining:years,role:high?'一軍名單競爭':'二軍適應',signedForYear:state.year+1}}
      const salary=Math.round((high?110000:72000)*(aggressive?1.1:1)/1000)*1000,years=high?2:1;return{league,team,level:high?'MiLB高階／40人名單競爭':'MiLB發展合約',salary,currency:'USD',years,yearsRemaining:years,role:high?'高階小聯盟與40人名單競爭':'小聯盟發展',signedForYear:state.year+1}
    }
    function commitProMove(offer,entryMethod){
      state.team=offer.team;state.contract={...offer};state.proIdentity=state.proIdentity||{};Object.assign(state.proIdentity,{team:offer.team,league:offer.league,level:offer.level,entryMethod,joinedYear:state.year+1});state.rosterRole=offer.role||state.rosterRole;
      state.careerMemberships=state.careerMemberships||[];state.careerMemberships.push({team:offer.team,level:offer.level,joinedYear:state.year+1,entryMethod,jerseyNumber:state.proIdentity.jerseyNumber||null});
      state.offseasonCommitment={team:offer.team,league:offer.league,entryMethod}
    }
    function marketFollowupEvent(item,index){
      const chance=item.chance||50,pro=state.stage==='PRO';
      if(pro&&/原球團續約/.test(item.route)){
        const offer=renewalOffer(item,false),better=renewalOffer(item,true);
        return{id:'OFFSEASON_RENEWAL_'+state.year+'_'+index,type:'CONTRACT EVENT',marketFollowup:true,binding:true,marketKind:'RENEWAL',marketItem:item,offer,title:state.team+'把續約條件放到桌上',text:'你回覆資料後，'+state.team+'正式提出下一份合約框架：'+offer.years+' 年、年薪 '+moneyText(offer.salary,offer.currency)+'。你要現在簽、繼續談，還是測試市場？',choices:[
          marketChoice('接受目前續約條件',96,'續約完成','球團完成合約文件，你的下一季角色也正式確認。',{morale:5,coachTrust:4},'行政程序暫時卡住','雙方仍需補齊最後文件。',{morale:-1},'ACCEPT_RENEWAL'),
          marketChoice('要求提高年薪與保障年限',clamp(46+Math.round(chance*.35),45,82),'談判成功','球團接受你提高保障的要求，重新送來更好的版本。',{morale:7,scoutInterest:2},'球團暫停加碼','球團維持原案，要求你重新考慮。',{morale:-3},'NEGOTIATE_RENEWAL'),
          marketChoice('先不簽，測試其他市場',100,'保留市場彈性','你沒有立刻簽字，經紀團隊開始聽取其他可能。',{scoutInterest:3},'保留市場彈性','你沒有立刻簽字。',{scoutInterest:2},'DECLINE')
        ],betterOffer:better}
      }
      if(pro&&/交易|自由市場/.test(item.route)){
        const trade=(state.contract?.league||'CPBL')==='CPBL'&&contractYearsLeft()>0,offer=cpblMoveOffer(item,false),better=cpblMoveOffer(item,true),verb=trade?'交易窗口':'自由市場';
        if(trade){offer.salary=state.contract?.salary||offer.salary;offer.currency=state.contract?.currency||'TWD';offer.years=contractYearsLeft();offer.yearsRemaining=contractYearsLeft();offer.level=state.proIdentity?.level||state.contract?.level||'CPBL一軍';offer.role=state.rosterRole}
        return{id:'OFFSEASON_CPBL_MOVE_'+state.year+'_'+index,type:'MARKET EVENT',marketFollowup:true,binding:true,marketKind:trade?'TRADE':'FREE_AGENT',marketItem:item,offer,title:item.name+'把你列入'+verb+'優先名單',text:'你送出資料後，'+item.name+'要求進一步談角色與合約。'+(trade?'因你仍有原合約，若交易成立，現有合約會隨球員權利移轉。':'你的原合約已到期，可以直接談新約。')+(trade?' 現有合約：剩 '+offer.yearsRemaining+' 年、'+moneyText(offer.salary,offer.currency)+'/年。':' 初步條件：'+offer.years+' 年、'+moneyText(offer.salary,offer.currency)+'/年。'),choices:[
          marketChoice(trade?'接受轉隊，讓兩隊完成交易':'接受加盟條件',clamp(chance+12,48,94),trade?'交易完成':'正式加盟',trade?'兩隊完成交易，你將換上新的球衣；現有合約一併移轉。':'新球團完成合約登錄，你正式轉隊。',{morale:6,scoutInterest:4},'條件最後沒有成交','球團在最後階段沒有完成交易／簽約條件。',{morale:-3},'ACCEPT_CPBL_MOVE'),
          marketChoice(trade?'要求先談角色與延長合約':'要求更好的角色與薪資',clamp(chance-4,30,82),'加碼成功','對方提高條件，並把你的角色寫得更清楚。',{morale:8,scoutInterest:3},'談判破局','對方把資源轉向其他球員。',{morale:-5},'NEGOTIATE_CPBL_MOVE'),
          marketChoice('留在目前球隊，不往下談',100,'你關閉這個窗口','這次轉隊可能性到此為止。',{coachTrust:2},'你關閉這個窗口','這次轉隊可能性到此為止。',{coachTrust:2},'DECLINE')
        ],betterOffer:better}
      }
      if(pro&&/海外/.test(item.route)){
        const offer=overseasOffer(item,false),better=overseasOffer(item,true);
        return{id:'OFFSEASON_OVERSEAS_'+state.year+'_'+index,type:'CONTRACT EVENT',marketFollowup:true,binding:true,marketKind:'OVERSEAS',marketItem:item,offer,title:marketClubName(item.name)+'要求正式談旅外方案',text:'海外球團看完你回覆的資料後，把評估推進到合約／測試階段。現有方案：'+offer.league+' · '+offer.level+' · '+offer.years+' 年 · '+moneyText(offer.salary,offer.currency)+'/年。',choices:[
          marketChoice('接受旅外方案，進入簽約程序',clamp(chance+5,35,91),'旅外合約成立','你完成體檢與文件，生涯下一站正式移往海外。',{morale:10,scoutInterest:8},'最後一關沒有通過','體檢、名額或球團內部評估讓這次旅外暫停。',{morale:-6,scoutInterest:2},'ACCEPT_OVERSEAS'),
          marketChoice('要求更明確的層級與升降條款',clamp(chance-7,28,80),'球團願意加碼','對方把發展層級與升降條件寫進新版本。',{morale:8,scoutInterest:6},'球團不願提高保障','對方維持原方案，窗口開始降溫。',{morale:-4},'NEGOTIATE_OVERSEAS'),
          marketChoice('暫不旅外，留在原聯盟',100,'你保留目前路線','海外球團保留追蹤檔案，但本季不會成行。',{coachTrust:2},'你保留目前路線','本季旅外窗口關閉。',{coachTrust:2},'DECLINE')
        ],betterOffer:better}
      }
      if(/國際賽|代表隊/.test(item.route)){
        return{id:'OFFSEASON_NATIONAL_'+state.year+'_'+index,type:'NATIONAL TEAM EVENT',marketFollowup:true,binding:false,marketKind:'NATIONAL',marketItem:item,title:item.name+'發出下一階段通知',text:'你回覆資料後，代表隊教練團要求你確認參賽／培訓意願。這次不是單純追蹤，結果會直接寫進你的代表隊經歷。',choices:[
          marketChoice('接受徵召／培訓安排',clamp(chance+15,55,94),'正式進入名單','教練團完成名單確認，你將加入下一階段集訓與國際賽準備。',{morale:8,scoutInterest:7},'你被列為備選','名額競爭後你暫列備選，但仍可能遞補。',{morale:-2,scoutInterest:3},'ACCEPT_NATIONAL'),
          marketChoice('要求先確認角色與身體負荷',clamp(chance+5,45,88),'協調完成','教練團接受負荷規劃並保留你的正式席位。',{health:4,morale:5},'這次名單無法等待','教練團先使用其他球員。',{morale:-3},'ACCEPT_NATIONAL'),
          marketChoice('婉拒這次徵召',100,'你留在母隊準備','代表隊尊重你的決定，本次名單不再安排你。',{health:3,fatigue:-4},'你留在母隊準備','本次名單不再安排你。',{health:3},'DECLINE')
        ]}
      }
      return{id:'OFFSEASON_CONTACT_'+state.year+'_'+index,type:'MARKET EVENT',marketFollowup:true,binding:false,marketKind:'CONTACT',marketItem:item,title:item.name+'回覆你的資料',text:'對方收到完整資料後，決定是否把你推進到下一階段面談、測試或正式招募。',choices:[
        marketChoice('接受面談／測試安排',clamp(chance+12,42,94),'進入正式評估','對方排入下一階段流程，你的名字不再只是追蹤名單。',{scoutInterest:7,morale:4},'暫未進入下一輪','對方保留資料，但這次沒有立即名額。',{scoutInterest:2},'CONTACT'),
        marketChoice('先詢問角色與發展路徑',clamp(chance+3,35,88),'取得更明確資訊','對方願意說明角色、時程與下一步。',{scoutInterest:5,coachTrust:2},'回覆仍偏保守','對方暫時只願意維持追蹤。',{scoutInterest:1},'CONTACT'),
        marketChoice('暫不繼續這個窗口',100,'你關閉這次聯繫','這條路暫時停在這裡。',{morale:2},'你關閉這次聯繫','這條路暫時停在這裡。',{morale:2},'DECLINE')
      ]}
    }
    function buildMarketFollowups(){
      const replied=(state.marketOpportunities||[]).map((x,i)=>({x,i})).filter(v=>v.x.replied);state.marketFollowups=replied.map(v=>marketFollowupEvent(v.x,v.i));state.marketFollowupsBuilt=true
    }
    function applyMarketFollowupResult(e,ch,success){
      const action=ch.marketAction;if(!e.marketFollowup||!action)return'';
      if(action==='DECLINE')return'你沒有做出具約束力的簽約／轉隊承諾。';
      if(action==='ACCEPT_NATIONAL'){
        if(success){state.nationalTeam={...(state.nationalTeam||{}),status:'SELECTED',squad:e.marketItem.name,role:'正式名單'};addPublicTag('國家隊徵召');log(e.marketItem.name+'：正式確認進入名單。');return'代表隊狀態已更新為正式名單。'}
        state.nationalTeam={...(state.nationalTeam||{}),status:'RESERVE',squad:e.marketItem.name,role:'備選'};return'這次暫列備選，仍可能收到遞補通知。'
      }
      if(action==='CONTACT')return success?'對方已把你推進到正式面談／測試階段。':'這次仍停留在追蹤名單。';
      if(action==='FALLBACK_RENEW'){const offer=e.renewOffer;state.contract={...offer};state.offseasonCommitment={team:state.team,league:offer.league,entryMethod:'1年證明合約'};addPublicTag('完成續約');log(state.team+'：1 年證明合約成立，'+moneyText(offer.salary,offer.currency)+'/年。');return'合約成立：'+state.team+' · 1 年 · '+moneyText(offer.salary,offer.currency)+'/年。'}
      if(action==='FALLBACK_CPBL'){const offer=e.cpblOffer;commitProMove(offer,'自由市場短約');addPublicTag('自由市場轉隊');return'正式加盟：'+offer.team+' · 1 年 · '+moneyText(offer.salary,offer.currency)+'/年。'}
      if(action==='FALLBACK_OVERSEAS'){const offer=e.overseasOffer;commitProMove(offer,'旅外發展約');addPublicTag('旅外球員');return'旅外合約成立：'+offer.team+' · '+offer.league+' · '+moneyText(offer.salary,offer.currency)+'/年。'}
      if(!success)return'這次沒有形成正式合約或轉隊。';
      if(state.offseasonCommitment&&e.binding)return'你已經先完成另一份具約束力的職業安排，這個窗口自動關閉。';
      if(action==='ACCEPT_RENEWAL'||action==='NEGOTIATE_RENEWAL'){
        const offer=action==='NEGOTIATE_RENEWAL'?(e.betterOffer||e.offer):e.offer;state.contract={...offer};state.offseasonCommitment={team:state.team,league:offer.league,entryMethod:'續約'};addPublicTag('完成續約');log(state.team+'完成續約：'+offer.years+' 年、'+moneyText(offer.salary,offer.currency)+'/年。');return'續約成立：'+offer.years+' 年，年薪 '+moneyText(offer.salary,offer.currency)+'。'
      }
      if(action==='ACCEPT_CPBL_MOVE'||action==='NEGOTIATE_CPBL_MOVE'){
        let offer=action==='NEGOTIATE_CPBL_MOVE'?(e.betterOffer||e.offer):e.offer;
        if(e.marketKind==='TRADE'&&action==='ACCEPT_CPBL_MOVE'){offer={...e.offer,team:e.marketItem.name};commitProMove(offer,'季後交易');addPublicTag('完成交易');log('交易完成：'+offer.team+'；現有合約一併移轉。');return'交易完成：'+offer.team+'。現有合約剩 '+offer.yearsRemaining+' 年、'+moneyText(offer.salary,offer.currency)+'/年。'}
        commitProMove(offer,e.marketKind==='TRADE'?'交易後延長合約':'自由市場加盟');addPublicTag(e.marketKind==='TRADE'?'完成交易':'自由市場轉隊');log((e.marketKind==='TRADE'?'交易完成並延長合約：':'自由市場簽約：')+offer.team+'，'+offer.years+' 年、'+moneyText(offer.salary,offer.currency)+'/年。');return(e.marketKind==='TRADE'?'交易並換約完成：':'正式加盟：')+offer.team+' · '+offer.years+' 年 · '+moneyText(offer.salary,offer.currency)+'/年。'
      }
      if(action==='ACCEPT_OVERSEAS'||action==='NEGOTIATE_OVERSEAS'){
        const offer=action==='NEGOTIATE_OVERSEAS'?(e.betterOffer||e.offer):e.offer;commitProMove(offer,'旅外簽約');addPublicTag('旅外球員');log('旅外合約成立：'+offer.team+'（'+offer.league+'）'+offer.years+' 年、'+moneyText(offer.salary,offer.currency)+'/年。');return'旅外合約成立：'+offer.team+' · '+offer.league+' · '+offer.level+' · '+moneyText(offer.salary,offer.currency)+'/年。'
      }
      return''
    }
    function fallbackProContractEvent(){
      const other=stableMarketPick(CPBL_TEAMS.filter(x=>x.name!==state.team),'fallback-cpbl'),renew=renewalOffer({chance:38},false),cpbl=cpblMoveOffer({name:other.name,chance:42},false),overseasName=stableMarketPick(OVERSEAS_TEAMS,'fallback-overseas'),overseas=overseasOffer({name:overseasName,chance:35},false);
      renew.years=renew.yearsRemaining=1;renew.salary=Math.max(600000,Math.round((state.contract?.salary||600000)*.92/10000)*10000);
      cpbl.years=cpbl.yearsRemaining=1;cpbl.salary=Math.max(600000,Math.round((state.contract?.salary||600000)*.88/10000)*10000);
      overseas.years=overseas.yearsRemaining=1;
      return{id:'OFFSEASON_LAST_CONTRACT_'+state.year,type:'CONTRACT EVENT',marketFollowup:true,binding:true,guaranteedMarket:true,marketKind:'FALLBACK',marketItem:{name:'最後合約窗口',route:'自由市場最後確認'},title:'新球季前，你必須先決定下一份合約',text:'原合約已經到期，而且前面的市場窗口沒有形成正式簽約。你不能在沒有合約的狀態直接進下一季；目前仍有三條可落地路線。',choices:[
        marketChoice('接受 '+state.team+' 的 1 年證明合約',100,'留隊合約成立','你用一紙短約留下，下一季重新證明自己的市場價值。',{morale:3},'留隊合約成立','你用一紙短約留下。',{morale:3},'FALLBACK_RENEW'),
        marketChoice('轉投 '+other.name+' 的 1 年合約',100,'自由市場轉隊完成','你換一個環境，以短約重新爭取角色。',{morale:5,scoutInterest:2},'自由市場轉隊完成','你換一個環境重新出發。',{morale:5},'FALLBACK_CPBL'),
        marketChoice('接受 '+marketClubName(overseasName)+' 的海外發展約',100,'旅外合約成立','你選擇以發展合約打開海外生涯。',{morale:7,scoutInterest:4},'旅外合約成立','你選擇以發展合約打開海外生涯。',{morale:7},'FALLBACK_OVERSEAS')
      ],renewOffer:renew,cpblOffer:cpbl,overseasOffer:overseas}
    }
    function finalizeMarketAdvance(declined=false){
      if(state.stage==='PRO'&&!state.offseasonCommitment&&contractYearsLeft()<=0&&!state.marketFallbackShown){state.marketFallbackShown=true;const e=fallbackProContractEvent();state.phase='EVENT';state.lastDecision=null;state.currentDecision={kind:'EVENT',data:e};save(true);render();return}
      state.marketHistory=state.marketHistory||[];state.marketHistory.push({year:state.year,stage:state.stage,stageYear:state.stageYear,declined,responses:[...(state.marketResponses||[])],opportunities:(state.marketOpportunities||[]).map(x=>({...x})),commitment:state.offseasonCommitment?{...state.offseasonCommitment}:null});state.marketFollowups=[];state.marketFollowupsBuilt=false;
      if(state.stage==='HIGH_SCHOOL'&&state.stageYear>=3)return openTransition('POST_HIGH_SCHOOL');
      if(state.stage==='COLLEGE')return openTransition('COLLEGE_DRAFT_DECISION');
      if(state.stage==='AMATEUR')return openTransition('AMATEUR_DECISION');
      if(state.stage==='PRO'&&state.age>=42)return retire();
      if(state.stage==='PRO'&&state.age>=35)return openTransition('PRO_RETIREMENT');
      advanceStageYear()
    }
    function presentNextMarketFollowup(){
      while(state.marketFollowups&&state.marketFollowups.length){const e=state.marketFollowups.shift();if(state.offseasonCommitment&&e.binding){log(e.marketItem.name+'：因你已完成其他職業安排，這個簽約／交易窗口關閉。');continue}state.phase='EVENT';state.lastDecision=null;state.currentDecision={kind:'EVENT',data:e};save(true);render();return}finalizeMarketAdvance(false)
    }
    function respondMarket(i){const item=state.marketOpportunities[i];if(!item||item.replied)return;item.replied=true;const boost=4+(hash(state.seed+'|reply|'+state.year+'|'+i)%6);item.chance=clamp(item.chance+boost,8,97);item.status='資料已送出，等待對方正式回覆';state.marketResponses.push({name:item.name,route:item.route,chance:item.chance});log('回覆 '+item.name+' 的資料要求，目前機會評估為 '+item.chance+'%。');save(true);render()}
`;

      replaceRegex('market-helpers-and-respond',/    function respondMarket\(i\)\{[^\n]*\}\n    function archiveCurrentSeason/,helpers+'    function archiveCurrentSeason');

      // 3b) Once a player moves overseas, the next season must stop pretending it is CPBL.
      replaceRegex('dynamic-pro-competition',/    function competitionOpponent\(\)\{[\s\S]*?\n    \}\n    function regularCompetitionContext\(\)\{[\s\S]*?\n    \}\n    function matchupCompetitionContext/,
String.raw`    function activeCompetitionData(){
      if(state.stage!=='PRO')return COMPETITION_DATA[state.stage]||COMPETITION_DATA.HIGH_SCHOOL;
      const league=state.contract?.league||'CPBL';
      if(league==='NPB')return{competitions:[{name:'NPB 例行賽',rounds:['系列賽首戰','系列賽第二戰','系列賽最終戰','排名關鍵戰']}],opponents:['讀賣巨人','阪神虎','橫濱DeNA灣星','廣島東洋鯉魚','東京養樂多燕子','中日龍','福岡軟銀鷹','北海道日本火腿鬥士','千葉羅德海洋','東北樂天金鷲','歐力士猛牛','埼玉西武獅']};
      if(league==='KBO')return{competitions:[{name:'KBO 例行賽',rounds:['系列賽首戰','系列賽第二戰','系列賽最終戰','排名關鍵戰']}],opponents:['LG雙子','KT巫師','SSG登陸者','NC恐龍','斗山熊','KIA虎','樂天巨人','三星獅','韓華鷹','Kiwoom英雄']};
      if(league==='MLB')return{competitions:[{name:'MLB 例行賽',rounds:['系列賽首戰','系列賽第二戰','系列賽最終戰','排名關鍵戰']}],opponents:['洛杉磯道奇','紐約洋基','西雅圖水手','芝加哥小熊','舊金山巨人','聖地牙哥教士','休士頓太空人','波士頓紅襪','紐約大都會','費城費城人','亞特蘭大勇士','德州遊騎兵']};
      return COMPETITION_DATA.PRO
    }
    function competitionOpponent(){
      const data=activeCompetitionData(),previous=state.lastCompetitionOpponent,available=data.opponents.filter(x=>x!==state.team&&x!==previous),pool=available.length?available:data.opponents.filter(x=>x!==state.team),opponent=pick(pool.length?pool:data.opponents);state.lastCompetitionOpponent=opponent;return opponent
    }
    function regularCompetitionContext(){
      const data=activeCompetitionData(),index=state.regularMatchupsCompleted||0,competition=data.competitions[index%data.competitions.length],appearance=Math.floor(index/data.competitions.length),round=competition.rounds[Math.min(appearance,competition.rounds.length-1)],opponent=competitionOpponent();return{competition:competition.name,round,opponent,label:competition.name+'｜'+round+'｜對手：'+opponent}
    }
    function matchupCompetitionContext`);

      replaceRegex('dynamic-pro-postseason',/    function postseasonNames\(\)\{[\s\S]*?\n    \}\n    function activeCompetitionData/,
String.raw`    function postseasonNames(){
      if(state.stage==='PRO'){const league=state.contract?.league||'CPBL';if(league==='NPB')return{semi:'NPB Climax Series',final:'日本大賽'};if(league==='KBO')return{semi:'KBO 季後賽',final:'韓國大賽'};if(league==='MLB')return{semi:'MLB 聯盟冠軍系列賽',final:'世界大賽'};return{semi:'CPBL 季後挑戰賽',final:'CPBL 台灣大賽'}}
      if(state.stage==='AMATEUR')return {semi:'爆米花棒球聯盟準決賽',final:'爆米花棒球聯盟冠軍賽'};
      if(state.stage==='COLLEGE')return {semi:'大專棒球聯賽公開一級準決賽',final:'大專棒球聯賽公開一級冠軍賽'};
      return {semi:'高中木棒聯賽四強戰',final:'高中木棒聯賽冠軍賽'}
    }
    function activeCompetitionData`);

      replaceExact('dynamic-current-competition',
        "if(state.currentDecision?.data?.competition)return state.currentDecision.data.competition;const data=COMPETITION_DATA[state.stage]||COMPETITION_DATA.HIGH_SCHOOL,index=state.regularMatchupsCompleted||0;return data.competitions[index%data.competitions.length].name",
        "if(state.currentDecision?.data?.competition)return state.currentDecision.data.competition;const data=activeCompetitionData(),index=state.regularMatchupsCompleted||0;return data.competitions[index%data.competitions.length].name"
      );

      replaceExact('dynamic-pro-level',
        "if(state.stage==='PRO'&&state.proIdentity)state.proIdentity.level=state.rosterRole.startsWith('一軍')?'CPBL一軍':'CPBL二軍';",
        "if(state.stage==='PRO'&&state.proIdentity){const lg=state.contract?.league||'CPBL';state.proIdentity.level=lg==='NPB'?(state.rosterRole.startsWith('一軍')?'NPB一軍':'NPB二軍／育成'):lg==='KBO'?(state.rosterRole.startsWith('一軍')?'KBO一軍':'KBO二軍'):lg==='MLB'?(state.rosterRole.startsWith('一軍')?'MLB／40人名單競爭':'MiLB發展層級'):(state.rosterRole.startsWith('一軍')?'CPBL一軍':'CPBL二軍');if(state.contract)state.contract.level=state.proIdentity.level}"
      );

      // 4) Clicking “confirm replies” now enters the queue instead of skipping a year.
      replaceRegex('advance-from-market',/    function advanceFromMarket\(declined=false\)\{[\s\S]*?\n    \}\n    function statsMarkup\(\)/,
String.raw`    function advanceFromMarket(declined=false){
      if(declined)return finalizeMarketAdvance(true);
      if(!state.marketResponses.length)return;
      if(!state.marketFollowupsBuilt)buildMarketFollowups();
      if(!state.marketFollowups.length)return finalizeMarketAdvance(false);
      log('你已送出資料，接下來逐一處理對方的正式回覆。');
      presentNextMarketFollowup()
    }
    function statsMarkup()`);

      // 5) Offseason events can make real contract/team/national-team state changes.
      replaceExact('apply-event-market-followup',
        "function applyEvent(i){const e=state.currentDecision.data,ch=e.choices[i],chance=eventChance(ch),success=e.guaranteedMarket?true:rand()<chance/100,outcome=success?ch.success:ch.failure;rememberEvent(e);applyEffects(outcome.effect);normalize();state.eventIndex++;state.decisionEventIndex++;state.history.push({year:state.year,type:'choice',eventKey:e.eventKey,eventType:e.type,title:e.title,choice:ch.label,result:success?'POSITIVE_OUTCOME':'ADVERSE_OUTCOME',chance});state.evidenceLedger.push({year:state.year,kind:'PLAYER_CHOICE',eventType:e.type,title:e.title,choice:ch.label,outcome:success?'POSITIVE':'ADVERSE'});log(`${e.title}：你選擇「${ch.label}」，${outcome.title}。`);state.lastDecision={kind:'EVENT',eventType:e.type,success,title:e.title,choice:ch.label,chance,outcomeTitle:outcome.title,outcomeText:outcome.text,effectText:effectSummary(outcome.effect)};state.phase='EVENT_RESULT';save(true);render()}",
        "function applyEvent(i){const e=state.currentDecision.data,ch=e.choices[i],chance=eventChance(ch),success=e.guaranteedMarket?true:rand()<chance/100,outcome=success?ch.success:ch.failure;rememberEvent(e);applyEffects(outcome.effect);const marketNote=e.marketFollowup?applyMarketFollowupResult(e,ch,success):'';normalize();state.eventIndex++;state.decisionEventIndex++;state.history.push({year:state.year,type:'choice',eventKey:e.eventKey,eventType:e.type,title:e.title,choice:ch.label,result:success?'POSITIVE_OUTCOME':'ADVERSE_OUTCOME',chance});state.evidenceLedger.push({year:state.year,kind:'PLAYER_CHOICE',eventType:e.type,title:e.title,choice:ch.label,outcome:success?'POSITIVE':'ADVERSE'});log(`${e.title}：你選擇「${ch.label}」，${outcome.title}。`);state.lastDecision={kind:'EVENT',eventType:e.type,success,title:e.title,choice:ch.label,chance,outcomeTitle:outcome.title,outcomeText:outcome.text,effectText:marketNote||effectSummary(outcome.effect),marketFollowup:!!e.marketFollowup};state.phase='EVENT_RESULT';save(true);render()}"
      );

      // 6) After a market result, go to the next reply — never back into regular-season flow.
      replaceExact('continue-event-result-market',
        "function continueEventResult(){simulateCalendarAdvance();state.lastDecision=null;advanceSeasonFlow()}",
        "function continueEventResult(){if(state.lastDecision?.marketFollowup){state.lastDecision=null;return presentNextMarketFollowup()}simulateCalendarAdvance();state.lastDecision=null;advanceSeasonFlow()}"
      );

      // 7) Render the live contract in the sidebar.
      replaceExact('render-contract-summary',
        "const pro=state.stage==='PRO'&&state.proIdentity;$('#jerseyRow').style.display=pro?'flex':'none';$('#entryRow').style.display=pro?'flex':'none';if(pro){$('#jerseyNumber').textContent=state.proIdentity.jerseyNumber;$('#entryMethod').textContent=state.proIdentity.entryMethod==='CPBL選秀'?`${state.proIdentity.draftYear}年第 ${state.proIdentity.round} 輪／總順位 ${state.proIdentity.totalPick}`:state.proIdentity.entryMethod}",
        "const pro=state.stage==='PRO'&&state.proIdentity;$('#jerseyRow').style.display=pro?'flex':'none';$('#entryRow').style.display=pro?'flex':'none';$('#contractRow').style.display=state.stage==='PRO'?'flex':'none';if(pro){$('#jerseyNumber').textContent=state.proIdentity.jerseyNumber||'—';$('#entryMethod').textContent=state.proIdentity.entryMethod==='CPBL選秀'?`${state.proIdentity.draftYear}年第 ${state.proIdentity.round} 輪／總順位 ${state.proIdentity.totalPick}`:state.proIdentity.entryMethod}if(state.stage==='PRO')$('#contractSummary').textContent=contractSummary()"
      );

      // 7b) Make it visually explicit that this is an offseason market chain.
      html=html.replace("$('#decisionType').textContent='球季動態';","$('#decisionType').textContent=state.lastDecision.marketFollowup?'休賽季市場':'球季動態';");
      html=html.replace('id="continueEventBtn">繼續球季</button>', "id=\"continueEventBtn\">${state.lastDecision.marketFollowup?'處理下一個正式回覆':'繼續球季'}</button>");

      // 8) Copy communicates the new behavior.
      html=html.replace("$('#continueStageBtn').textContent=state.stage==='HIGH_SCHOOL'&&state.stageYear>=3?'確認回覆，決定畢業去向':'確認回覆，進入下一階段'","$('#continueStageBtn').textContent=state.stage==='HIGH_SCHOOL'&&state.stageYear>=3?'確認回覆，處理正式回信':'確認回覆，處理正式回信'");

      document.open();document.write(html);document.close();
    }catch(err){console.error(err);fail(err.message||err)}
  })();
  </script>
